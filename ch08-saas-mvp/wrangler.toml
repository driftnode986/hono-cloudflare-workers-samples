# wrangler.toml
name = "saas-api"
main = "src/index.ts"
compatibility_date = "2026-01-01"

[[d1_databases]]
binding = "DB"
database_name = "saas-db"
database_id = "<your-database-id>"

[[kv_namespaces]]
binding = "PLAN_KV"
id = "<your-kv-namespace-id>"

[[queues.producers]]
queue = "saas-jobs"
binding = "JOB_QUEUE"

[[queues.consumers]]
queue = "saas-jobs"
max_batch_size = 10
max_retries = 3
dead_letter_queue = "saas-jobs-dlq"
