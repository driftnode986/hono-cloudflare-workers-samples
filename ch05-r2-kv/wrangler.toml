name = "ch05-r2-kv"
main = "src/index.ts"
compatibility_date = "2025-12-01"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "my-files"

[[kv_namespaces]]
binding = "CACHE"
id = "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"

[[kv_namespaces]]
binding = "SESSIONS"
id = "yyyyyyyy-yyyy-yyyy-yyyy-yyyyyyyyyyyy"
